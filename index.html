<!DOCTYPE html>

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Clock</title>

    <style type="text/css">
        .centered-wrapper {
            position: relative;
            text-align: center;
            height : "100%";
        }
        .centered-wrapper:before {
            content: "";
            position: relative;
            display: inline-block;
            vertical-align: middle;
            width: 0; 
        }
        .centered-content {
            display: inline-block;
            vertical-align: middle;
        }
      </style>
  
    </head>
    <body class="centered-wrapper">
      <div id="qrcode" class="centered-content"></div>
    </body>
